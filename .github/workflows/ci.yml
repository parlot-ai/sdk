name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'docs-data/api.json'
      - '.github/workflows/ci.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'docs-data/api.json'
      - '.github/workflows/ci.yml'
      - 'pyproject.toml'
      - 'uv.lock'

permissions: {}

jobs:
  test:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install
        run: uv sync --all-packages
      - name: Lint and typecheck
        run: bash scripts/lint.sh
      - name: GenAI semconv lock
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_REF}" ]]; then
            BASE_REF=main
          fi
          git fetch origin "${BASE_REF}"
          uv run python scripts/check_genai_semconv_lock.py --base "origin/${BASE_REF}"
      - name: Check API JSON snapshot
        run: |
          uv run python scripts/dump_api.py
          git diff --exit-code docs-data/api.json
      - name: Pytest (core)
        run: uv run pytest -q packages/core/tests
      - name: Pytest (langgraph)
        run: uv run pytest -q packages/instrumentation-langgraph/tests
      - name: Pytest (livekit)
        run: uv run pytest -q packages/instrumentation-livekit/tests
      - name: Pytest (pipecat)
        run: uv run pytest -q packages/instrumentation-pipecat/tests
      - name: Build smoke test (all packages)
        run: |
          uv build --package parlot
          uv build --package parlot-core
          uv build --package parlot-instrumentation-livekit
          uv build --package parlot-instrumentation-langgraph
          uv build --package parlot-instrumentation-pipecat
