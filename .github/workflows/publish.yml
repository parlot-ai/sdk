name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - parlot
          - parlot-core
          - parlot-instrumentation-livekit
          - parlot-instrumentation-langgraph
      repository:
        description: "Target repository"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

permissions:
  id-token: write
  contents: read

jobs:
  publish-parlot:
    name: Publish parlot
    runs-on: ubuntu-latest
    environment:
      name: pypi-parlot
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.package == 'all' || github.event.inputs.package == 'parlot') ||
      github.event_name == 'release' && startsWith(github.event.release.tag_name, 'parlot-v')
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Build parlot
        run: uv build --package parlot --out-dir dist/
      - name: Publish to PyPI
        if: ${{ github.event.inputs.repository != 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Publish to TestPyPI
        if: ${{ github.event.inputs.repository == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-core:
    name: Publish parlot-core
    runs-on: ubuntu-latest
    environment:
      name: pypi-core
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.package == 'all' || github.event.inputs.package == 'parlot-core') ||
      github.event_name == 'release' && startsWith(github.event.release.tag_name, 'core-v')
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Build parlot-core
        run: uv build --package parlot-core --out-dir dist/
      - name: Publish to PyPI
        if: ${{ github.event.inputs.repository != 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Publish to TestPyPI
        if: ${{ github.event.inputs.repository == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-livekit:
    name: Publish parlot-instrumentation-livekit
    runs-on: ubuntu-latest
    environment:
      name: pypi-livekit
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.package == 'all' || github.event.inputs.package == 'parlot-instrumentation-livekit') ||
      github.event_name == 'release' && startsWith(github.event.release.tag_name, 'instrumentation-livekit-v')
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Build parlot-instrumentation-livekit
        run: uv build --package parlot-instrumentation-livekit --out-dir dist/
      - name: Publish to PyPI
        if: ${{ github.event.inputs.repository != 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Publish to TestPyPI
        if: ${{ github.event.inputs.repository == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-langgraph:
    name: Publish parlot-instrumentation-langgraph
    runs-on: ubuntu-latest
    environment:
      name: pypi-langgraph
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.package == 'all' || github.event.inputs.package == 'parlot-instrumentation-langgraph') ||
      github.event_name == 'release' && startsWith(github.event.release.tag_name, 'instrumentation-langgraph-v')
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Build parlot-instrumentation-langgraph
        run: uv build --package parlot-instrumentation-langgraph --out-dir dist/
      - name: Publish to PyPI
        if: ${{ github.event.inputs.repository != 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Publish to TestPyPI
        if: ${{ github.event.inputs.repository == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
