[project]
name = "parlot-sdk"
version = "0.0.0"
description = "Parlot SDK workspace (dev/test runner)"
requires-python = ">=3.11"
dependencies = [
    "parlot-core",
    "parlot-instrumentation-livekit",
    "parlot-instrumentation-langgraph",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/instrumentation-livekit",
    "packages/instrumentation-langgraph",
]

[tool.uv.sources]
parlot-core = { workspace = true }
parlot-instrumentation-livekit = { workspace = true }
parlot-instrumentation-langgraph = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
import_mode = "importlib"
pythonpath = ["packages/instrumentation-livekit/tests"]
testpaths = [
    "packages/core/tests",
    "packages/instrumentation-livekit/tests",
    "packages/instrumentation-langgraph/tests",
]
