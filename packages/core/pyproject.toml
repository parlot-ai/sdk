[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parlot-core"
version = "0.1.0"
description = "Shared semantic conventions and processors for Parlot production voice AI observability"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Parlot AI", email = "hi@parlot.ai" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
keywords = ["opentelemetry", "telemetry", "ai", "agents", "observability", "parlot"]
dependencies = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-semantic-conventions>=0.48b0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://parlot.ai"
Documentation = "https://parlot.ai/docs"
Repository = "https://github.com/parlot-ai/sdk"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/parlot"]

[tool.hatch.build.targets.sdist]
include = [
    "src/parlot",
    "README.md",
]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
