[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parlot-instrumentation-langgraph"
version = "0.1.0"
description = "OTel instrumentation for LangGraph / LangChain agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "parlot-core>=0.1.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "langgraph>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parlot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
