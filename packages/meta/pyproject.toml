[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parlot"
version = "0.3.1"
description = "Production voice AI observability — MIT OpenTelemetry instrumentation for LiveKit Agents"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Parlot AI", email = "hi@parlot.ai" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
keywords = ["opentelemetry", "telemetry", "ai", "agents", "observability", "parlot"]
dependencies = [
    "parlot-core>=0.4.0",
]

[project.optional-dependencies]
livekit = ["parlot-instrumentation-livekit>=0.4.0"]
langgraph = ["parlot-instrumentation-langgraph>=0.4.0"]
all = [
    "parlot-instrumentation-livekit>=0.4.0",
    "parlot-instrumentation-langgraph>=0.4.0",
]

[project.urls]
Homepage = "https://parlot.ai"
Documentation = "https://parlot.ai/docs"
Repository = "https://github.com/parlot-ai/sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/parlot"]

[tool.hatch.build.targets.sdist]
include = [
    "src/parlot",
    "README.md",
    "LICENSE",
]
