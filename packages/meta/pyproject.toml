[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parlot"
version = "0.3.5"
description = "Know if production voice AI agents work — MIT OpenTelemetry instrumentation for LiveKit, Pipecat, and LangGraph"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Parlot AI", email = "hi@parlot.ai" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
keywords = [
    "opentelemetry",
    "telemetry",
    "ai",
    "agents",
    "voice",
    "observability",
    "parlot",
    "livekit",
    "pipecat",
    "langgraph",
]
dependencies = [
    "parlot-core>=0.4.9",
]

[project.optional-dependencies]
livekit = ["parlot-instrumentation-livekit>=0.4.0"]
langgraph = ["parlot-instrumentation-langgraph>=0.4.2"]
pipecat = ["parlot-instrumentation-pipecat>=0.1.6"]
recording-opus = ["av>=14,<17"]
all = [
    "parlot-instrumentation-livekit>=0.4.0",
    "parlot-instrumentation-langgraph>=0.4.2",
    "parlot-instrumentation-pipecat>=0.1.6",
]

[project.urls]
Homepage = "https://parlot.ai"
Documentation = "https://parlot.ai/docs"
Repository = "https://github.com/parlot-ai/sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/parlot"]

[tool.hatch.build.targets.sdist]
include = [
    "src/parlot",
    "README.md",
    "LICENSE",
]
