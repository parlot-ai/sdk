[project]
name = "parlot-example-multi-agent"
version = "0.0.0"
description = "Parlot + LiveKit multi-agent storytelling example"
requires-python = ">=3.11"
dependencies = [
    "parlot-core",
    "parlot-instrumentation-livekit",
    "livekit-agents[openai,deepgram,google,silero]",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
parlot-core = { git = "https://github.com/parlot-ai/sdk.git", subdirectory = "packages/core", tag = "v0.1.0" }
parlot-instrumentation-livekit = { git = "https://github.com/parlot-ai/sdk.git", subdirectory = "packages/instrumentation-livekit", tag = "v0.1.0" }
