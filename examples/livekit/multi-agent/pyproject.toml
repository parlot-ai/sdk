[project]
name = "parlot-example-multi-agent"
version = "0.0.0"
description = "Parlot + LiveKit multi-agent storytelling example"
requires-python = ">=3.11"
dependencies = [
    "parlot-core",
    "parlot-instrumentation-livekit",
    "livekit-agents[openai,deepgram,google,silero]",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
parlot-core = { path = "../../../packages/core", editable = true }
parlot-instrumentation-livekit = { path = "../../../packages/instrumentation-livekit", editable = true }
