[project]
name = "parlot-example-drive-thru"
version = "0.0.0"
description = "Parlot + LiveKit drive-thru ordering example with persona sample sessions"
requires-python = ">=3.11"
dependencies = [
    "parlot-core",
    "parlot-instrumentation-livekit",
    "livekit-agents[silero]",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
parlot-core = { path = "../../../packages/core", editable = true }
parlot-instrumentation-livekit = { path = "../../../packages/instrumentation-livekit", editable = true }
