[project]
name = "parlot-example-hotel-receptionist"
version = "0.0.0"
description = "Parlot + LiveKit boutique-hotel receptionist example with scripted sample sessions"
requires-python = ">=3.11"
dependencies = [
    "parlot-core",
    "parlot-instrumentation-livekit",
    "livekit-agents[silero]",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "apsw>=3.46",
    "tzdata>=2024.1",
]

[tool.uv]
package = false

[tool.uv.sources]
parlot-core = { path = "../../../packages/core", editable = true }
parlot-instrumentation-livekit = { path = "../../../packages/instrumentation-livekit", editable = true }
