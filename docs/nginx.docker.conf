server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docusaurus baseUrl is /docs/ — static build lives under /docs/
    location = / {
        return 302 /docs/;
    }

    location /docs/ {
        try_files $uri $uri/ $uri.html /docs/index.html;
    }
}
